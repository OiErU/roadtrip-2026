<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forests">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>html{padding-top:env(safe-area-inset-top,0px);background:#0B1310}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forests &amp; Waterfalls 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dusk-forest field guide. Painted ridgeline hero, cover-image day pages, floating tab bar. Dark-first, mist-light alternative. */
:root{
  --bg:#0C120F; --bg-2:#101814; --card:#151F1A; --card-2:#1C2822; --ink:#ECEFE6; --muted:#9AA79C; --faint:#6E7B71;
  --line:rgba(236,239,230,.09); --line-2:rgba(236,239,230,.16);
  --brass:#D6B572; --brass-ink:#1A1408; --moss:#97C47F; --river:#86BEC9; --rust:#E58268; --warn:#EDB562;
  --moss-bg:rgba(151,196,127,.12); --river-bg:rgba(134,190,201,.12); --rust-bg:rgba(229,130,104,.13); --warn-bg:rgba(237,181,98,.13); --brass-bg:rgba(214,181,114,.12);
  --glass:rgba(16,24,20,.72); --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  --hero-ink:#F1F3EA; --hero-muted:rgba(241,243,234,.72);
  --f-display:"Gloock",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:20px; --r-s:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EDF0EA; --bg-2:#E3E8E0; --card:#FBFCF9; --card-2:#F0F3EC; --ink:#132019; --muted:#566259; --faint:#87928A;
  --line:rgba(19,32,25,.09); --line-2:rgba(19,32,25,.16);
  --brass:#8A6624; --brass-ink:#FFFDF6; --moss:#3D6A2E; --river:#1F6370; --rust:#B4432D; --warn:#8C5410;
  --moss-bg:rgba(61,106,46,.10); --river-bg:rgba(31,99,112,.09); --rust-bg:rgba(180,67,45,.09); --warn-bg:rgba(140,84,16,.10); --brass-bg:rgba(138,102,36,.10);
  --glass:rgba(251,252,249,.78); --shadow:0 18px 40px -22px rgba(19,32,25,.35);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EDF0EA; --bg-2:#E3E8E0; --card:#FBFCF9; --card-2:#F0F3EC; --ink:#132019; --muted:#566259; --faint:#87928A;
  --line:rgba(19,32,25,.09); --line-2:rgba(19,32,25,.16);
  --brass:#8A6624; --brass-ink:#FFFDF6; --moss:#3D6A2E; --river:#1F6370; --rust:#B4432D; --warn:#8C5410;
  --moss-bg:rgba(61,106,46,.10); --river-bg:rgba(31,99,112,.09); --rust-bg:rgba(180,67,45,.09); --warn-bg:rgba(140,84,16,.10); --brass-bg:rgba(138,102,36,.10);
  --glass:rgba(251,252,249,.78); --shadow:0 18px 40px -22px rgba(19,32,25,.35);
  color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0B1310}
a{color:var(--river);text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.serif{font-family:var(--f-display)}

/* ---------- Hero ---------- */
.hero{position:relative;color:var(--hero-ink);overflow:hidden;background:#0B1310;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .wrap{padding-block:34px 26px;display:grid;gap:18px}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font-family:var(--f-display);font-size:clamp(46px,13.5vw,84px);line-height:.92;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:#D6B572}
.hero .sub{margin:0;color:var(--hero-muted);max-width:44ch;font-size:15.5px}
.trail-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted)}
.trail-line span{display:inline-flex;align-items:center}
.trail-line span+span::before{content:"";width:18px;height:1px;background:rgba(241,243,234,.35);margin:0 8px}
.trail-line .camp{color:#D6B572}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(241,243,234,.14);padding-top:14px;gap:8px}
.hstats div{display:grid;gap:2px}
.hstats b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--hero-ink)}
.hstats span{font-size:12px;color:var(--hero-muted)}

/* ---------- Views ---------- */
main{padding-block:22px 128px}
.view{display:grid;gap:26px}
.head{display:grid;gap:6px}
.head h2{font-family:var(--f-display);font-size:38px;line-height:1.02}
.head p{margin:0;color:var(--muted);max-width:58ch}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line-2);border-radius:24px;padding:6px;box-shadow:var(--shadow)}
.tabbar a{display:grid;justify-items:center;gap:1px;padding:7px 4px 6px;border-radius:18px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--ink);background:var(--brass-bg)}
.tabbar a[aria-current="page"] svg{stroke:var(--brass)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- Media ---------- */
.media{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;background:var(--card-2);max-width:100%}
.media img,.media canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,10,0) 35%,rgba(8,12,10,.82) 100%)}
.media .cap{position:absolute;left:18px;right:18px;bottom:16px;color:#F1F3EA;display:grid;gap:6px}
.media .cap h3{font-family:var(--f-display);font-size:clamp(30px,8.5vw,44px);line-height:1}
.media .cap .eyebrow{color:rgba(241,243,234,.8)}
.media .badge{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(11,19,16,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#F1F3EA;border:1px solid rgba(241,243,234,.18)}
.media .badge.today{background:#D6B572;color:#1A1408;border-color:transparent}

/* ---------- Day overview list ---------- */
.legs{display:grid;gap:10px}
.leg-title{display:flex;align-items:baseline;gap:12px;padding-top:6px}
.leg-title h3{font-family:var(--f-display);font-size:24px}
.leg-title span{color:var(--muted);font-size:13px}
.leg-title::after{content:"";flex:1;height:1px;background:var(--line-2);align-self:center}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit}
.row.is-today{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.thumb{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--card-2)}
.thumb img,.thumb canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row-main{min-width:0;display:grid;gap:2px}
.row-main .eyebrow{font-size:10.5px}
.row-main h4{font-family:var(--f-display);font-size:21px;line-height:1.1}
.row-main p{margin:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-km{text-align:right;padding-right:6px}
.row-km b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1}
.row-km span{font-size:11px;color:var(--muted)}

/* ---------- Chart ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.panel h3{font-family:var(--f-display);font-size:24px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}

/* ---------- Day detail ---------- */
.daynav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer}
.pill[aria-disabled="true"]{opacity:.35;pointer-events:none}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:4px 10px;background:rgba(241,243,234,.14);color:#F1F3EA;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lede{margin:0;font-size:17px;color:var(--ink);max-width:60ch}
.block{display:grid;gap:12px}
.drive{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px;border-radius:var(--r-s);background:var(--rust-bg);color:var(--ink);font-size:15px}
.drive svg{width:22px;height:22px;stroke:var(--rust);fill:none;stroke-width:1.7;margin-top:1px}
.drive b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.tl{list-style:none;margin:0;padding:0 0 0 2px;display:grid}
.tl li{position:relative;display:grid;grid-template-columns:62px 1fr;gap:12px;padding:0 0 14px 18px;font-size:15px}
.tl li::before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--brass)}
.tl li::after{content:"";position:absolute;left:5px;top:20px;bottom:0;width:1px;background:var(--line-2)}
.tl li:last-child::after{display:none}
.tl .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px}

.hike{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.hike .media{border-radius:0;aspect-ratio:16/9}
.hike-body{padding:16px 16px 18px;display:grid;gap:12px}
.hike-body h4{font-family:var(--f-display);font-size:26px;line-height:1.08}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.stats div{padding:9px 10px;display:grid;gap:1px;min-width:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.05;white-space:nowrap}
.stats small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stats .sm{font-family:var(--f-body);font-size:13px;font-weight:700;white-space:normal;line-height:1.2;padding-top:3px}
.hike-body p{margin:0;color:var(--muted);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:7px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:36px}
.btn.wl{color:var(--moss);background:var(--moss-bg);border-color:transparent}
.btn.map{color:var(--river);background:var(--river-bg);border-color:transparent}
.btn.wn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.note{display:grid;gap:3px;font-size:14.5px;padding:13px 15px;border-radius:var(--r-s);background:var(--moss-bg);border:1px solid transparent}
.note b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
.note.warn{background:var(--warn-bg)} .note.warn b{color:var(--warn)}
.note.surf{background:var(--river-bg)} .note.surf b{color:var(--river)}
.sleep{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-s);background:var(--brass-bg);font-size:14.5px}
.sleep svg{width:22px;height:22px;stroke:var(--brass);fill:none;stroke-width:1.7;flex:none}
.sleep a{color:var(--ink);font-weight:700}

/* ---------- Choices ---------- */
.choice{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:4px 6px;height:max-content;text-align:center}
.tag.keep{background:var(--moss-bg);color:var(--moss)} .tag.move{background:var(--river-bg);color:var(--river)}
.tag.new{background:var(--brass);color:var(--brass-ink)} .tag.opt{background:var(--warn-bg);color:var(--warn)}
.choice h4{font-size:15.5px;font-weight:700;font-family:var(--f-body);margin-bottom:2px}
.choice p{margin:0;font-size:14px;color:var(--muted)}

/* ---------- Lists ---------- */
.lists{display:grid;gap:12px}
details.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.list summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:2px 14px;align-items:center;padding:16px}
details.list summary::-webkit-details-marker{display:none}
.ring{grid-row:1/3;width:44px;height:44px}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--brass);stroke-linecap:round;transition:stroke-dashoffset .35s}
summary .lt{font-family:var(--f-display);font-size:22px;line-height:1.1}
summary .ls{font-size:13px;color:var(--muted);grid-column:2}
summary .count{grid-row:1/3;grid-column:3;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
details[open] summary{border-bottom:1px solid var(--line)}
.items{display:grid;padding:4px 6px}
.item{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:11px 10px;border-radius:10px;cursor:pointer;font-size:15.5px}
.item+.item{border-top:1px solid var(--line)}
.item input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border:1.5px solid var(--faint);border-radius:50%;display:grid;place-items:center;background:transparent;cursor:pointer;transition:background .15s,border-color .15s}
.item input:checked{background:var(--moss);border-color:var(--moss)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item input:checked + span{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-2)}
.item small{display:block;color:var(--muted);font-size:13px;text-decoration:none}
.list-foot{display:flex;justify-content:flex-end;padding:6px 16px 16px}
.reset{font:inherit;font-size:13px;font-weight:700;color:var(--rust);background:none;border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;cursor:pointer}
.reset[data-armed]{background:var(--rust);color:var(--card);border-color:var(--rust)}

/* ---------- Info ---------- */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-family:var(--f-display);font-size:24px;line-height:1.1}
.card p{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.phone{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--brass);background:var(--brass-bg);border:1px solid transparent;border-radius:999px;padding:8px 14px;min-height:40px;text-decoration:none;user-select:text;-webkit-user-select:text}
.phone svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.b24{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.1em;background:var(--rust);color:var(--card);border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:5px}
ul.tight{margin:0;padding-left:18px;display:grid;gap:7px;font-size:15px}
ul.tight li::marker{color:var(--brass)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.foot{color:var(--faint);font-size:12.5px;text-align:center;margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:640px){.row{grid-template-columns:96px 1fr auto}.thumb{width:96px;height:96px}}
</style>
</head>
<body>


<header class="hero">
  <canvas id="hero-art" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="eyebrow">20–29 November 2026 · VW T6 · Woodcrest · four dogs</div>
    <h1>Forests &amp;<br><em>Waterfalls</em></h1>
    <p class="sub">Atlantic oak forests on the Costa da Morte, then the granite highlands of Peneda-Gerês.</p>
    <div class="hstats" id="hstats"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" data-view="today" id="v-today"></section>
  <section class="view" data-view="plan" id="v-plan" hidden></section>
  <section class="view" data-view="day" id="v-day" hidden></section>
  <section class="view" data-view="lists" id="v-lists" hidden></section>
  <section class="view" data-view="info" id="v-info" hidden></section>
</main>

<div class="tabbar"><nav aria-label="Sections">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>Today</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M2.5 19.5l6.5-13 4.5 8 2.5-4 5.5 9z"/></svg>Plan</a>
  <a href="#lists" data-tab="lists"><svg viewBox="0 0 24 24"><path d="M10 6.5h10M10 12h10M10 17.5h10"/><circle cx="5" cy="6.5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17.5" r="1.6"/></svg>Lists</a>
  <a href="#info" data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Info</a>

 {date:"2026-11-20",n:1,base:"road",cover:{scene:"road",seed:2},title:"Run north",lede:"Straight to Galicia so Saturday starts with the first trail, not the drive.",

 {date:"2026-11-21",n:2,base:"gal",title:"Mills & a hillfort",lede:"Big shop in the morning, then a wooded stream of old mills up to an Iron Age castro.",

 {date:"2026-11-22",n:3,base:"gal",title:"Waterfall & mill woods",lede:"Two short, gentle walks close to camp. A low-load day before the Eume, and the first possible surf slot.",
  drive:"Local only · 20–30 min from camp to each trailhead.",
  timeline:[["10:00","Refuxio de Verdes loop"],["~12:30","Lunch, then Fervenza de San Paio (Entrecruces)"],["15:00","Possible bodyboard slot at Razo. Silvana and the dogs walk the dunes."]],
  hikes:[

    wl:"https://www.wikiloc.com/hiking-trails/refuxio-de-verdes-verdes-186638666",mq:"Refuxio de Verdes, Coristanco"},
   {name:"Fervenza de San Paio",photo:"sanpaio",km:2.0,gain:113,type:"Loop",time:"~40 min",
    text:"Short loop around the Entrecruces waterfall. Most of the climb comes in one short section, so go slowly with the older dogs.",

   {name:"Fragas do Mandeo · Zarzo–Chelo",opt:"Optional swap",scene:"oakriver",seed:53,km:10.5,gain:null,type:"Loop",time:"~3 h 30",
    text:"Riverside Atlantic forest along the Mandeo in the Mariñas–Mandeo Biosphere Reserve, past the Presa da Cabra weir, with roe deer and otters about. The full loop is 10.5 km. If everyone feels fresh, do it instead of Verdes + San Paio, or walk part of it from Chelo and turn back. About 45 min from camp, and it makes Sunday a long day right before the Eume, so only if the dogs are flying.",
    src:"https://blog.turismo.gal/?p=14090",srcLabel:"Route description",mq:"Ponte de Chelo, Coirós"}],

 {date:"2026-11-23",n:4,base:"gal",cover:{photo:"eumeValley"},title:"Fragas do Eume",lede:"The deep Atlantic forest, and the reason for the Galicia week. It's a Monday, so parking should be quiet.",
  drive:"Camp → Fragas do Eume (Pontedeume side) about 1 h each way. Outside summer you can drive to the Santa Cristina bridge near Caaveiro.",
  timeline:[["09:00","Leave camp"],["10:00","Start walking"],["~12:30","Lunch at San Xoán de Caaveiro monastery"],["~15:00","Walk back. Leave the forest by 16:30 so you drive back in daylight."],["","Did the short version? Add the Fervenza do Belelle on the way back (about 1 h)."]],
  hikes:[{name:"Camiño dos Encomendeiros",photo:"eume",km:11.8,gain:110,type:"Circuit",time:"~4 h",
    text:"Full version: the Wikiloc circuit from the Cal Grande suspension bridge to Caaveiro, about 6 km in the morning and 6 km in the afternoon with a long lunch between. Short version for tired legs: park at Santa Cristina bridge and walk to the monastery and along the river, 4–6 km out and back.",
    wl:"https://pt.wikiloc.com/trilhas-trekking/p-nat-fragas-do-eume-camino-dos-encomendeiros-do-ponte-colgante-de-cal-grande-ao-mosteiro-de-san-xo-73382233",mq:"Ponte de Santa Cristina, Caaveiro, Fragas do Eume",
    warn:[["Route status (Xunta)","https://patrimonionatural.xunta.gal/es/node/46"],["Rope section & tips","https://blog.mundo-r.com/rutas-fragas-do-eume/"]]},
   {name:"Fervenza do Belelle · Neda",opt:"Add-on with the short Eume",scene:"falls",seed:41,km:4,gain:null,type:"Out & back",time:"~1 h",
    text:"A waterfall of more than 40 m in the woods, 15–20 min from the Eume. Park at the end of the narrow road by the small power station and follow the path along the stone water channel to the foot of the falls, about 4 km there and back. Skip the steep path up to the wooden viewpoint.",
    src:"https://blog.turismo.gal/the-belelle-waterfall/",srcLabel:"Route description",mq:"Fervenza do Belelle, Neda",
    warn:[["Roots & slippery pools","https://blog.turismo.gal/the-belelle-waterfall/"]]}],
  notes:[["warn","Not with the dogs: the rope section","Walkers report a slippery rocky mound and a mud-and-stone stretch where a rope is used. That isn't dog terrain. Its exact position isn't documented, so treat it as your turnaround: if you reach the rope, go back the way you came. The short version (Santa Cristina bridge → Caaveiro → along the river and back) is the safest choice. The route has also had temporary closures in past years, so check the Xunta page or the Centro de Interpretación the day before."],["moss","Dog plan","This is the longest day of the trip. Decide the full or short version at the lunch stop based on the older two."]],
  sleep:NEVEDAS,night:"Night 4 of 5"},
 {date:"2026-11-24",n:5,base:"gal",title:"Recovery & Ézaro",lede:"An easy day after the Eume. Surf in the morning if the forecast is good, then the waterfall that drops to the sea.",
  drive:"Camp → O Ézaro (Dumbría) about 1 h 20 each way along the Costa da Morte.",
  timeline:[["09:30","Possible bodyboard slot at Razo (alternative to Sunday)"],["12:30","Drive to Ézaro, lunch with the view"],["~14:30","Waterfall walkway"],["~17:00","Back at camp. Prepare to pack down tomorrow."]],
  hikes:[{name:"Fervenza do Ézaro",scene:"falls",seed:11,km:0.9,gain:0,type:"Walkway",time:"~30 min",
    text:"Stone steps beside the power plant, then a wooden walkway to the foot of the falls. Flow depends on dam releases. After heavy rain it's spectacular, and in dry spells it can be a trickle.",

    warn:[["Access & flow","https://visitacostadamorte.com/en/post/cascada-del-ezaro"]]},
   {name:"Fraga de Cecebre · Mero river",opt:"Closer option",scene:"oakriver",seed:47,km:4,gain:null,type:"Out & back",time:"~1 h 30",
    text:"The forest that inspired 'El bosque animado', about 30–35 min from camp instead of 1 h 20. Be aware that only a small part of the old forest remains: it isn't a marked trail, the paths alternate between dirt and paving, and there's eucalyptus around. Walk from the Cecebre station area along the Mero river and the old mills, and turn back whenever you like. Choose it over Ézaro if you'd rather drive less after the Eume.",
    wl:"https://www.wikiloc.com/mountain-biking-trails/senda-fluvial-rio-mero-a-barcala-cecebre-pazo-de-orto-34585033",wlLabel:"Mero river path (Wikiloc)",mq:"Apeadeiro de Cecebre, Cambre"}],
  notes:[["warn","Route filter","Ignore Wikiloc routes that climb Monte Pindo or A Moa. They are steep and rocky granite, not dog terrain."],["surf","Surf slot B","Book the session on whichever day (Sun or Tue) has the better forecast. This is the easiest day to skip if you'd rather rest everyone."]],
  sleep:NEVEDAS,night:"Night 5 of 5"},
 {date:"2026-11-25",n:6,base:"road",title:"Mills & redwoods on the way",lede:"Pack down, then two short forest stops near Pontevedra (Barosa's waterfall and mills, then Poio's sequoias), and reach the mountains with daylight to spare.",

function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>((s=(s^(s<<13))>>>0,s=(s^(s>>>17))>>>0,s=(s^(s<<5))>>>0)%10000)/10000}
function paint(cv,kind,seed){
  const W=cv.clientWidth||cv.parentElement.clientWidth||320,H=cv.clientHeight||cv.parentElement.clientHeight||200;
  const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  const p=PAL[kind]||PAL.oak, r=rng(seed||7);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,p.sky[0]);g.addColorStop(.55,p.sky[1]);g.addColorStop(1,p.sky[2]);x.fillStyle=g;x.fillRect(0,0,W,H);
  const sg=x.createRadialGradient(W*p.sun[0],H*p.sun[1],0,W*p.sun[0],H*p.sun[1],Math.max(W,H)*.55);sg.addColorStop(0,p.sun[2]);sg.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=sg;x.fillRect(0,0,W,H);
  const n=p.ridges.length;
  for(let i=0;i<n;i++){
    const base=H*(.42+i*.14), amp=H*(.16-i*.025), f1=1.2+r()*2.2, f2=3+r()*5, ph=r()*6.28, ph2=r()*6.28;
    const yAt=t=>base-amp*(.55*Math.sin(t*f1+ph)+.3*Math.sin(t*f2+ph2)+.15*Math.sin(t*13+ph*2));
    x.beginPath();x.moveTo(0,H);
    for(let px=0;px<=W;px+=4){x.lineTo(px,yAt(px/W*Math.PI))}
    x.lineTo(W,H);x.closePath();x.fillStyle=p.ridges[i];x.fill();
    // mist band
    const mg=x.createLinearGradient(0,base-amp*.2,0,base+amp*1.2);mg.addColorStop(0,"rgba(220,230,220,0)");mg.addColorStop(.5,`rgba(220,230,220,${i<n-1?.10:0})`);mg.addColorStop(1,"rgba(220,230,220,0)");
    x.fillStyle=mg;x.fillRect(0,base-amp*.2,W,amp*1.4);
    // trees on near ridges
    const trees=(kind==="oak"||kind==="oakriver"||kind==="castro")?(i>=n-2):(kind==="road"||kind==="hero"||kind==="valley")?(i===n-1):(i===n-1);
    if(trees){
      const count=Math.round(W/(i===n-1?16:11));
      x.fillStyle=p.ridges[i];
      for(let k=0;k<count;k++){
        const tx=(k+r()*.8)/count*W, ty=yAt(tx/W*Math.PI)+2;
        const s=(i===n-1?1:.6)*(8+r()*10)*(H/200);
        if(kind==="oak"||kind==="oakriver"||kind==="castro"){
          x.beginPath();x.arc(tx,ty-s*.9,s*.75,0,6.28);x.arc(tx-s*.55,ty-s*.55,s*.55,0,6.28);x.arc(tx+s*.55,ty-s*.6,s*.6,0,6.28);x.fill();
        }else{
          x.beginPath();x.moveTo(tx,ty-s*2.1);x.lineTo(tx-s*.6,ty);x.lineTo(tx+s*.6,ty);x.closePath();x.fill();
        }
      }
    }
    if(kind==="falls"&&i===1){
      const fx=W*.58, top=yAt(fx/W*Math.PI)+4, bot=H*.86;
      const fg=x.createLinearGradient(0,top,0,bot);fg.addColorStop(0,"rgba(235,245,245,.95)");fg.addColorStop(1,"rgba(235,245,245,.45)");
      x.fillStyle=fg;x.beginPath();x.moveTo(fx-W*.025,top);x.lineTo(fx+W*.025,top);x.lineTo(fx+W*.05,bot);x.lineTo(fx-W*.045,bot);x.closePath();x.fill();
      const mist=x.createRadialGradient(fx,bot,0,fx,bot,W*.22);mist.addColorStop(0,"rgba(235,245,245,.55)");mist.addColorStop(1,"rgba(235,245,245,0)");x.fillStyle=mist;x.fillRect(0,0,W,H);
    }
    if(kind==="castro"&&i===1){
      const cx=W*.36, cy=yAt(cx/W*Math.PI)+H*.02;x.strokeStyle="rgba(210,205,180,.55)";x.lineWidth=1.4;
      for(let k=0;k<3;k++){x.beginPath();x.ellipse(cx+k*W*.035,cy+k*2,W*.022,H*.015,0,0,6.28);x.stroke()}
    }
  }
  if(kind==="oakriver"||kind==="valley"||kind==="road"){
    x.strokeStyle=kind==="road"?"rgba(220,200,160,.55)":"rgba(200,225,230,.55)";x.lineWidth=kind==="road"?2:2.6;x.beginPath();
    for(let k=0;k<=40;k++){const t=k/40;const px=W*(.5+.32*Math.sin(t*3.2+seed))*(1-t*.3)+W*.15*t, py=H*.72+t*H*.3;k?x.lineTo(px,py):x.moveTo(px,py)}
    x.stroke();
  }
  // grain
  x.globalAlpha=.06;for(let k=0;k<W*H/60;k++){x.fillStyle=r()>.5?"#fff":"#000";x.fillRect(r()*W,r()*H,1,1)}x.globalAlpha=1;
}
function paintAll(root){root.querySelectorAll("canvas[data-scene]").forEach(c=>paint(c,c.dataset.scene,+c.dataset.seed||1))}

/* ================= Builders ================= */
function imgFor(o,cls){
  if(o&&o.photo&&HAS(o.photo))return `<img src="${PHOTOS[o.photo]}" alt="" loading="lazy">`;
  return `<canvas data-scene="${o&&o.scene||"oak"}" data-seed="${o&&o.seed||3}" aria-hidden="true"></canvas>`;
}
const coverOf=d=>d.cover||(d.hikes[0]?{photo:d.hikes[0].photo,scene:d.hikes[0].scene,seed:d.hikes[0].seed}:{scene:"road",seed:d.n});
const baseLabel=b=>b==="gal"?"Galicia":b==="pen"?"Peneda-Gerês":"Road day";

function hikeHTML(h){
  const links=[];
  if(h.wl)links.push(`<a class="btn wl" href="${h.wl}" target="_blank" rel="noopener">${esc(h.wlLabel||"Wikiloc")} ↗</a>`);
  if(h.src)links.push(`<a class="btn wl" href="${h.src}" target="_blank" rel="noopener">${esc(h.srcLabel||"Official route sheet")} ↗</a>`);
  (h.warn||[]).forEach(([t,u])=>links.push(`<a class="btn wn" href="${u}" target="_blank" rel="noopener">⚠ ${esc(t)} ↗</a>`));
  links.push(`<a class="btn map" href="${maps(h.mq)}" target="_blank" rel="noopener">Trailhead ↗</a>`);
  return `<article class="hike"><div class="media">${imgFor(h)}${h.opt?`<span class="badge">${esc(h.opt)}</span>`:""}</div><div class="hike-body">
   <h4>${esc(h.name)}</h4>
   <div class="stats"><div><b>${h.km}</b><small>km</small></div><div><b>${h.gain===null?"–":h.gain}</b><small>${h.gain===null?"climb":"m climb"}</small></div><div><b class="sm">${esc(h.time)}</b><small>time</small></div><div><b class="sm">${esc(h.type)}</b><small>type</small></div></div>
   <p>${esc(h.text)}</p><div class="btns">${links.join("")}</div></div></article>`;
}

  return `<a class="row${d.date===T?" is-today":""}" href="#day${d.n}"><span class="thumb">${imgFor(c)}</span>
   <span class="row-main"><span class="eyebrow">${f.w} ${f.d} · Day ${d.n}</span><h4>${esc(d.title)}</h4><p>${esc(d.hikes.filter(h=>!h.opt).map(h=>h.name.split(" · ")[0]).join(" + ")||"Drive day")}</p></span>
   <span class="row-km"><b>${km?km.toFixed(1):"–"}</b><span>${km?"km":""}</span></span></a>`;
}

function chart(){
  const W=360,H=200,P={l:24,r:4,t:22,b:40},iw=W-P.l-P.r,ih=H-P.t-P.b,max=12,bw=iw/DAYS.length,y=v=>P.t+ih-(v/max)*ih;
  let g="";
  [0,6,12].forEach(v=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-dasharray="${v?"2 3":"0"}"/><text x="${P.l-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`});
  DAYS.forEach((d,i)=>{
    const km=kmOf(d), gain=d.hikes.reduce((a,h)=>a+(h.gain||0),0), x=P.l+i*bw+bw*.2, w=bw*.6, f=fd(d.date);
    const col=d.base==="gal"?"var(--river)":d.base==="pen"?"var(--moss)":"var(--rust)";
    if(km)g+=`<rect x="${x}" y="${y(km)}" width="${w}" height="${y(0)-y(km)}" rx="4" fill="${col}"/>`;
    g+=`<text x="${x+w/2}" y="${(km?y(km):y(0))-6}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${km?km.toFixed(1):""}</text>`;
    if(gain>=200)g+=`<circle cx="${x+w/2}" cy="${y(0)-9}" r="3.5" fill="var(--card)" stroke="var(--warn)" stroke-width="1.8"/>`;
    g+=`<text x="${x+w/2}" y="${H-P.b+15}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${f.w.slice(0,2)}</text><text x="${x+w/2}" y="${H-P.b+29}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${f.d}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Walking kilometres per day">${g}</svg>`;
}

function ring(p){const C=2*Math.PI*18;return `<svg class="ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 22 22)"/></svg>`}
function listHTML(l){
  const done=l.items.filter((_,i)=>checks[l.id+":"+i]).length;
  return `<details class="list" id="list-${l.id}"><summary>${ring(done/l.items.length)}<span class="lt">${esc(l.title)}</span><span class="ls">${esc(l.sub)}</span><span class="count">${done}/${l.items.length}</span></summary>
   <div class="items">${l.items.map(([t,s],i)=>`<label class="item" for="c-${l.id}-${i}"><input type="checkbox" id="c-${l.id}-${i}" data-key="${l.id}:${i}"${checks[l.id+":"+i]?" checked":""}><span>${esc(t)}${s?`<small>${esc(s)}</small>`:""}</span></label>`).join("")}</div>
   <div class="list-foot"><button class="reset" type="button" data-reset="${l.id}">Clear list</button></div></details>`;
}
function renderLists(){

function refreshList(id){

}

/* ================= Routing ================= */
function route(){
  const h=(location.hash||"").slice(1);
  let v="today", day=null;
  if(["today","plan","lists","info"].includes(h))v=h;
  const m=h.match(/^day(\d+)$/);if(m){day=DAYS.find(d=>d.n===+m[1]);if(day)v="day"}
  if(v==="day"){$("#v-day").innerHTML=dayDetail(day);paintAll($("#v-day"))}
  document.querySelectorAll("[data-view]").forEach(s=>s.hidden=s.dataset.view!==v);
  const tab=v==="day"?"plan":v;
  document.querySelectorAll("[data-tab]").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,v==="today"?0:Math.max(0,$("main").offsetTop-8));
  requestAnimationFrame(()=>paintAll($("#v-"+v)));
}

/* ================= Events ================= */
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.key;if(!k)return;if(e.target.checked)checks[k]=1;else delete checks[k];save();refreshList(k.split(":")[0])});
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-reset]");
  if(r){if(!r.hasAttribute("data-armed")){r.setAttribute("data-armed","");r.textContent="Tap again to clear";setTimeout(()=>{r.removeAttribute("data-armed");r.textContent="Clear list"},3000);return}
    const id=r.dataset.reset;Object.keys(checks).forEach(k=>{if(k.startsWith(id+":"))delete checks[k]});save();
    document.querySelectorAll(`#list-${id} input`).forEach(i=>i.checked=false);refreshList(id);r.removeAttribute("data-armed");r.textContent="Clear list";return}
  const o=e.target.closest("[data-open]");if(o)setTimeout(()=>{const d=document.getElementById("list-"+o.dataset.open);if(d){d.open=true;d.scrollIntoView({block:"start"})}},30);
});
window.addEventListener("hashchange",route);
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{paint($("#hero-art"),"hero",4);document.querySelectorAll("section:not([hidden]) canvas[data-scene]").forEach(c=>paint(c,c.dataset.scene,+c.dataset.seed))},200)});

/* ================= Boot ================= */
renderStats();renderToday();renderPlan();renderLists();renderInfo();
paint($("#hero-art"),"hero",4);
route();
})();
