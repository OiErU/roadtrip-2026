<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E3E6DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181C1A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forests">
<meta name="description" content="Phone guide for the 20–29 November 2026 roadtrip: Galicia's Atlantic forests and Peneda-Gerês.">
<title>Forests &amp; Waterfalls 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preload" as="image" href="img/eumeRiver.jpg">
<style>
/*
  Waymark field guide.
  Granite and lichen surfaces; the yellow-over-red PR trail mark is the one bold device:
  it marks the active tab, each day on the trail, "today", and (as an X) the places not to go.
  Galicia days are Atlantic blue, Peneda-Gerês days are moss, road days are earth.
*/
:root{
  --paper:#E3E6DF; --surface:#F5F6F2; --sunk:#D6DBD2; --ink:#1D2320; --muted:#545E57; --faint:#858D87;
  --line:rgba(29,35,32,.13); --line-2:rgba(29,35,32,.24);
  --y:#EDB81C; --r:#C13A2A;
  --atl:#245A6B; --moss:#456A30; --earth:#7B5A32;
  --atl-bg:rgba(36,90,107,.10); --moss-bg:rgba(69,106,48,.11); --r-bg:rgba(193,58,42,.09); --y-bg:rgba(237,184,28,.18);
  --on-photo:#F6F7F2; --shade:rgba(14,18,16,.86);
  --f-sign:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171B19; --surface:#212623; --sunk:#2B312D; --ink:#E8EBE4; --muted:#A1A9A2; --faint:#737B75;
  --line:rgba(232,235,228,.11); --line-2:rgba(232,235,228,.22);
  --r:#E4604D; --atl:#7FB6C6; --moss:#9EC27E; --earth:#CFA46C;
  --atl-bg:rgba(127,182,198,.12); --moss-bg:rgba(158,194,126,.12); --r-bg:rgba(228,96,77,.13); --y-bg:rgba(237,184,28,.14);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171B19; --surface:#212623; --sunk:#2B312D; --ink:#E8EBE4; --muted:#A1A9A2; --faint:#737B75;
  --line:rgba(232,235,228,.11); --line-2:rgba(232,235,228,.22);
  --r:#E4604D; --atl:#7FB6C6; --moss:#9EC27E; --earth:#CFA46C;
  --atl-bg:rgba(127,182,198,.12); --moss-bg:rgba(158,194,126,.12); --r-bg:rgba(228,96,77,.13); --y-bg:rgba(237,184,28,.14);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--atl);text-underline-offset:3px;text-decoration-thickness:1px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.num{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:4px}

/* The signature: PR waymark, yellow over red */
.wm{display:inline-grid;grid-template-rows:1fr 1fr;width:22px;height:10px;flex:none;vertical-align:middle}
.wm::before{content:"";background:var(--y)} .wm::after{content:"";background:var(--r)}
.wm-x{position:relative;display:inline-block;width:22px;height:22px;flex:none}
.wm-x::before,.wm-x::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:5px;margin-top:-2.5px}
.wm-x::before{background:var(--y);transform:rotate(45deg)} .wm-x::after{background:var(--r);transform:rotate(-45deg)}
.wm-turn{position:relative;display:inline-block;width:22px;height:20px;flex:none}
.wm-turn::before{content:"";position:absolute;left:0;top:4px;width:16px;height:5px;background:var(--y);box-shadow:0 6px 0 var(--r)}
.wm-turn::after{content:"";position:absolute;right:0;top:4px;width:5px;height:16px;background:linear-gradient(90deg,var(--y) 50%,var(--r) 50%);display:none}

/* ---------- Top: hero (Today) and slim bar (other tabs) ---------- */
.hero{position:relative;min-height:min(84svh,660px);display:grid;align-items:end;color:var(--on-photo);background:#26302A;overflow:hidden;isolation:isolate}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,18,16,.35) 0%,rgba(14,18,16,0) 26%,rgba(14,18,16,.15) 48%,var(--shade) 100%)}
.hero .wrap{width:100%;padding-top:calc(env(safe-area-inset-top) + 24px);padding-bottom:30px;display:grid;gap:14px}
.hero h1{font-family:var(--f-sign);font-weight:900;text-transform:uppercase;font-size:clamp(60px,19.5vw,128px);line-height:.8;letter-spacing:-.005em;margin-left:-2px}
.hero h1 span{display:block}
.hero .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:600;font-size:15px;color:rgba(246,247,242,.9)}
.hero .route .wm{width:16px;height:7px}
.hero .when{font-size:18px;max-width:34ch;color:var(--on-photo)}
.hero .when b{font-family:var(--f-sign);font-weight:800;font-size:1.65em;line-height:1;letter-spacing:.01em}
.hero .credit{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);font-size:11px;color:rgba(246,247,242,.7);text-decoration:none}
.bar{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:4px}
.bar .wrap{display:flex;align-items:center;gap:10px;font-family:var(--f-sign);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.02em}
.bar .wrap span:last-child{margin-left:auto;font-family:var(--f-body);text-transform:none;font-weight:600;font-size:14px;color:var(--muted);letter-spacing:0}

/* ---------- Views ---------- */
main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 40px)}
.view{display:grid;gap:30px;padding-top:24px}
.title{font-family:var(--f-sign);font-weight:900;text-transform:uppercase;font-size:clamp(52px,15vw,76px);line-height:.86}
.h2{font-family:var(--f-sign);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;letter-spacing:.005em}
.h3{font-family:var(--f-sign);font-weight:800;font-size:27px;line-height:1}
.sub{color:var(--muted);max-width:56ch}
.lbl{font-weight:700;font-size:14px;color:var(--muted)}
.stack{display:grid;gap:12px}
.sec-head{display:grid;gap:6px}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);border-top:1px solid var(--line-2);padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tabbar a{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a::before{content:"";position:absolute;top:0;left:50%;width:30px;margin-left:-15px;height:7px;background:linear-gradient(var(--y) 50%,var(--r) 50%);transform:scaleY(0);transform-origin:top;transition:transform .2s}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"]::before{transform:scaleY(1)}

/* ---------- Buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:14.5px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 13px;min-height:42px;cursor:pointer}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.warn{color:var(--r);border-color:color-mix(in srgb,var(--r) 40%,transparent);background:var(--r-bg)}
.tel{font-variant-numeric:tabular-nums;color:var(--ink);background:var(--y-bg);border-color:transparent}

/* ---------- Weather strip (Today) ---------- */
.wx-strip{display:grid;grid-auto-flow:column;grid-auto-columns:76px;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left)));padding:2px max(16px,env(safe-area-inset-left)) 6px;scrollbar-width:none}
.wx-strip::-webkit-scrollbar{display:none}
.wxd{scroll-snap-align:start;display:grid;justify-items:center;gap:4px;padding:10px 4px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative}
.wxd .dw{font-weight:700;font-size:13px;color:var(--muted)} .wxd .dn{font-family:var(--f-sign);font-weight:800;font-size:24px;line-height:.9}
.wxd svg{width:30px;height:30px}
.wxd .t{font-weight:700;font-size:14.5px} .wxd .t span{color:var(--muted);font-weight:400}
.wxd .p{font-size:12.5px;color:var(--atl);font-weight:700}
.wxd.typ{background:transparent;border-style:dashed}
.wxd.typ .p{color:var(--faint)}
.wxd .base{position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px}
.base-gal{background:var(--atl)} .base-pen{background:var(--moss)} .base-road{background:var(--earth)}
.wx-note{font-size:13.5px;color:var(--muted)}
.wi{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wi .sun{stroke:var(--y);fill:var(--y)} .wi .rain{stroke:var(--atl)} .wi .snow{fill:var(--atl);stroke:none} .wi .bolt{fill:var(--y);stroke:none}

/* ---------- Progress block ---------- */
.prog{display:grid;gap:10px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.meter{height:10px;border-radius:2px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(var(--y) 50%,var(--r) 50%);transition:width .35s}

/* ---------- Plan: the trail ---------- */
.leg{display:grid;gap:4px}
.leg-head{display:grid;gap:2px;padding:6px 0 10px}
.leg-head .h2 small{display:block}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail::before{content:"";position:absolute;left:28px;top:8px;bottom:8px;width:2px;background:var(--line-2)}
.trail li{position:relative}
.stop{display:grid;grid-template-columns:58px 1fr 72px;gap:12px;align-items:center;padding:10px 0;text-decoration:none;color:inherit}
.stop .date{position:relative;display:grid;justify-items:center;background:var(--paper);padding:4px 0;z-index:1}
.stop .date span{font-size:12.5px;font-weight:700;color:var(--muted)}
.stop .date b{font-family:var(--f-sign);font-weight:800;font-size:30px;line-height:.9}
.stop .date .wm{margin-top:5px}
.stop .mid{min-width:0;display:grid;gap:3px}
.stop h3{font-family:var(--f-sign);font-weight:800;font-size:25px;line-height:1}
.stop .walks{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stop .facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;font-weight:700}
.stop .facts .w{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted)}
.stop .facts svg{width:18px;height:18px}
.stop .thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.stop.is-today .date{outline:2px solid var(--y);outline-offset:2px;border-radius:6px}
.stop.is-past{opacity:.6}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.fold>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .2s;flex:none}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.choice{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:3px 6px;height:max-content;text-align:center}
.tag.keep{background:var(--moss-bg);color:var(--moss)} .tag.move{background:var(--atl-bg);color:var(--atl)}
.tag.new{background:var(--y);color:#1D2320} .tag.opt{background:var(--sunk);color:var(--muted)}
.choice h4{font-size:15.5px;margin-bottom:2px} .choice p{font-size:14.5px;color:var(--muted)}

/* ---------- Day page ---------- */
.dayhero{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left)));min-height:min(62svh,520px);display:grid;align-items:end;color:var(--on-photo);background:#26302A;overflow:hidden;isolation:isolate}
.dayhero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.dayhero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,18,16,.45) 0%,rgba(14,18,16,0) 25%,rgba(14,18,16,0) 45%,var(--shade) 100%)}
.dayhero .in{padding:0 max(16px,env(safe-area-inset-left)) 22px;display:grid;gap:8px}
.dayhero .when{font-weight:700;font-size:15px;color:rgba(246,247,242,.9);display:flex;align-items:center;gap:8px}
.dayhero h2{font-family:var(--f-sign);font-weight:900;text-transform:uppercase;font-size:clamp(50px,15vw,84px);line-height:.84}
.dayhero .nav{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:8px}
.chipnav{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 13px;border-radius:999px;background:rgba(14,18,16,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--on-photo);text-decoration:none;font-weight:700;font-size:14px}
.chipnav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.chipnav[aria-disabled="true"]{opacity:.35;pointer-events:none}
.facts-row{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:5px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.fact.gal{color:var(--atl)} .fact.pen{color:var(--moss)} .fact.road{color:var(--earth)}
.lede{font-size:19px;line-height:1.45;max-width:36ch}

.wxcard{display:grid;grid-template-columns:56px 1fr;gap:4px 14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.wxcard>svg{grid-row:1/3;width:56px;height:56px}
.wxcard .big{font-family:var(--f-sign);font-weight:800;font-size:30px;line-height:1}
.wxcard .big span{color:var(--muted);font-weight:600}
.wxcard .det{font-size:14px;color:var(--muted)}
.wxcard .src{grid-column:1/-1;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.wxcard.typ{border-style:dashed;background:transparent}

.drive{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-left:4px solid var(--earth);background:var(--surface);border-radius:0 10px 10px 0;font-size:15.5px}
.drive svg{width:24px;height:24px;stroke:var(--earth);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drive b{display:block;font-size:14px;color:var(--earth)}

.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px}
.tl li:first-child{border-top:0}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}

.hike{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.hike .ph{position:relative;aspect-ratio:16/10;background:var(--sunk)}
.hike .ph img{width:100%;height:100%;object-fit:cover}
.hike .ph .flag{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:6px 10px;border-radius:6px;background:var(--surface);color:var(--ink)}
.hike .bd{padding:16px 16px 18px;display:grid;gap:14px}
.hike h4{font-family:var(--f-sign);font-weight:800;font-size:29px;line-height:.98}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.stats div{padding:8px 8px 8px 0;display:grid;min-width:0}
.stats div+div{padding-left:10px;border-left:1px solid var(--line)}
.stats b{font-family:var(--f-sign);font-weight:800;font-size:25px;line-height:1.05;white-space:nowrap}
.stats b.s{font-family:var(--f-body);font-size:14px;line-height:1.25;padding-top:4px;white-space:normal}
.stats small{font-size:12.5px;color:var(--muted)}
.hike p{color:var(--muted);font-size:15.5px}
.ph-credit{font-size:11.5px;color:var(--faint);margin-top:-6px}
.ph-credit a{color:inherit}

.note{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15.5px;padding:14px 16px;border-radius:10px;background:var(--moss-bg)}
.note>i{grid-row:1/3;margin-top:5px}
.note b{display:block;color:var(--moss)}
.note.warn{background:var(--r-bg)} .note.warn b{color:var(--r)}
.note.surf{background:var(--atl-bg)} .note.surf b{color:var(--atl)}
.note.shop{background:var(--y-bg)} .note.shop b{color:var(--ink)}
.sleep{display:flex;gap:12px;align-items:center;padding:16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:15.5px}
.sleep svg{width:26px;height:26px;stroke:var(--y);fill:none;stroke-width:1.8;flex:none;stroke-linejoin:round}
.sleep a{color:var(--paper);font-weight:700}
.sleep small{display:block;color:color-mix(in srgb,var(--paper) 70%,transparent);font-size:13.5px}

/* ---------- Map ---------- */
.mapwrap{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left)));height:calc(100svh - var(--tab-h) - env(safe-area-inset-bottom) - 64px - env(safe-area-inset-top));min-height:380px;background:var(--sunk)}
#map{position:absolute;inset:0}
.mapfilters{position:absolute;z-index:500;top:10px;left:10px;right:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mapfilters button{flex:none;font:inherit;font-size:14px;font-weight:700;padding:8px 12px;min-height:40px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mapfilters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.map-off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.pin{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-family:var(--f-sign);font-weight:800;font-size:17px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.gal{background:#245A6B} .pin.pen{background:#456A30} .pin.road{background:#7B5A32} .pin.opt{opacity:.75;border-style:dashed}
.pin.camp{border-radius:6px;background:#1D2320;width:34px;height:34px}
.pin.camp svg{width:20px;height:20px;fill:#EDB81C;stroke:none}
.pin.vet{background:#C13A2A;border-radius:6px;font-family:var(--f-body);font-size:18px}
.pin.dot{width:18px;height:18px;background:#545E57}
.pin.dot.surf{background:#245A6B} .pin.dot.home{background:#EDB81C}
.leaflet-container{font-family:var(--f-body);background:var(--sunk)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-size:14.5px;line-height:1.4}
.leaflet-popup-content b{display:block;font-family:var(--f-sign);font-size:20px;font-weight:800;line-height:1.05;margin-bottom:2px}
.leaflet-popup-content .pl{display:flex;gap:12px;margin-top:6px;font-weight:700}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom.leaflet-right .leaflet-control-zoom{margin-bottom:22px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.72) contrast(1.1) saturate(.8)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.72) contrast(1.1) saturate(.8)}

/* ---------- Lists ---------- */
details.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.list summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:16px}
details.list summary::-webkit-details-marker{display:none}
summary .lt{font-family:var(--f-sign);font-weight:800;font-size:26px;line-height:1}
summary .count{font-weight:700;font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
summary .ls{font-size:14px;color:var(--muted)}
summary .meter{grid-column:1/-1;height:6px;margin-top:6px}
details.list[open] summary{border-bottom:1px solid var(--line)}
.items{display:grid;padding:4px 8px}
.item{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 8px;cursor:pointer;font-size:16px}
.item+.item{border-top:1px solid var(--line)}
.item input{appearance:none;-webkit-appearance:none;margin:0;width:26px;height:26px;border:2px solid var(--faint);border-radius:5px;display:grid;place-items:center;background:transparent;cursor:pointer}
.item input:checked{background:var(--moss);border-color:var(--moss)}
.item input:checked::after{content:"";width:6px;height:12px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item input:checked + span{color:var(--faint);text-decoration:line-through}
.item small{display:block;color:var(--muted);font-size:13.5px}
.list-foot{display:flex;justify-content:flex-end;padding:6px 16px 16px}
.reset{font:inherit;font-size:14px;font-weight:700;color:var(--r);background:none;border:1px solid var(--line-2);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer}
.reset[data-armed]{background:var(--r);color:var(--surface);border-color:var(--r)}

/* ---------- Info ---------- */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card .k{font-size:14px;font-weight:700;color:var(--muted)}
.card p{font-size:15.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.h24{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:700;background:var(--r);color:#fff;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:4px}
ul.tight{margin:0;padding-left:18px;display:grid;gap:8px;font-size:15.5px}
ul.tight li::marker{color:var(--r)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:13.5px}
.credits{font-size:13px;color:var(--muted);display:grid;gap:3px}
.credits a{color:inherit}

/* One orchestrated moment: the title stripes in on first load */
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.hero h1 span{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span+span{animation-delay:.12s}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.stop{grid-template-columns:64px 1fr 96px}.stop .thumb{width:96px;height:96px}.trail::before{left:31px}}
</style>
</head>
